{% extends 'library_app/base.html' %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Register</button>
    </form>

    <div class="auth-link">
      Already registered?
      <a href="{% url 'login' %}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
